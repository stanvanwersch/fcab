<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FCAB Rekenkern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Developer- en klantportaal van de FCAB-rekenkern, in de stijl van de FCAB-website:
   crème canvas, zwevende witte topbalk, linkerrail als navigatie, rustige inhoud; code in donker blok. */
:root{
  color-scheme:light;
  --cream:#faf9f7; --bg2:#f8fafd; --accent-d:#b4561a; --white:#ffffff; --border:#e8e4de; --border2:#d4cfc8;
  --text:#1c1a17; --text2:#5a5650; --text3:#9c9690;
  --accent:#e07a2f; --accent-s:rgba(224,122,47,.09); --accent-b:rgba(224,122,47,.22);
  --green:#1a6e3c; --green-s:rgba(26,110,60,.08);
  --amber:#b45309; --amber-s:rgba(180,83,9,.08);
  --code-bg:#1c1a17; --code-text:#e8e0d4;
  --k0:#e1ecdc; --k1:#d7e7cd; --k2:#ecebbf; --k3:#f3d8a4; --k4:#e9b1a1; --k5:#c66d5c; --kna:#ecebe7;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --word:'Poppins',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:#dcd8d2 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#dcd8d2;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#c9c4bd;background-clip:padding-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--text);background:var(--bg2)}
button,input,select,textarea{font-family:var(--sans);font-size:13.5px;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:256px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);background:var(--bg2)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:8px 16px 8px 12px}
.logo{width:240px;flex:none;display:flex;align-items:center;gap:12px;padding-left:8px;min-width:0}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:none}
.mark i{width:17px;height:17px;border-radius:3px;display:grid;place-items:center;font:700 10px var(--word);color:#fff;font-style:normal}
.prod{font-family:var(--word);font-size:19px;font-weight:400;color:var(--text);white-space:nowrap}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:12px;height:46px;border-radius:23px;background:#e9eef6;padding:0 8px 0 16px;color:var(--text2);position:relative}
.search:focus-within{background:var(--white);box-shadow:0 1px 3px rgba(60,64,67,.3)}
.search input{flex:1;border:0;background:none;font-size:15px;outline:0;min-width:0}
.search .sug{top:calc(100% + 4px)}
.tr{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--text2);cursor:pointer}
.ib:hover{background:rgba(60,64,67,.08)}
.envsw{display:inline-flex;border-radius:20px;padding:3px;background:#e9eef6;margin-right:6px}
.envsw button{border:0;background:none;border-radius:16px;padding:5px 14px;font-size:13px;color:var(--text2);cursor:pointer}
.envsw button.on{background:var(--white);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:500}
.av{width:34px;height:34px;border-radius:50%;background:#4BAE8A;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;margin-left:4px;border:0;cursor:pointer}
.side{position:relative;overflow-y:auto;padding:22px 0 20px;display:flex;flex-direction:column}
.new{display:inline-flex;align-items:center;gap:12px;margin:4px 0 14px 8px;align-self:flex-start;height:56px;padding:0 22px 0 16px;border-radius:16px;border:0;background:var(--white);box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);font-size:14px;font-weight:500;cursor:pointer;position:relative}
.new:hover{box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);background:#f6f8fc}
.newm{position:absolute;left:12px;top:66px;z-index:30;background:var(--white);border-radius:6px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);padding:6px 0;min-width:220px}
.newm button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:8px 16px;font-size:14px;text-align:left;cursor:pointer}
.newm button:hover{background:#f1f3f4}
.ni{display:flex;align-items:center;gap:14px;height:32px;width:calc(100% - 16px);padding:0 12px 0 16px;border-radius:16px;cursor:pointer;color:var(--text);font-size:14px;border:0;background:none;text-align:left;margin:0 0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni svg{flex:none;color:var(--text2)}
.ni:hover{background:rgba(60,64,67,.08)}
.ni.on{background:#ffe3cc;font-weight:600}
.ni.on svg{color:var(--text)}
.ni .mt{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text3)}
.gap{height:14px}
.quota{padding:10px 24px 0}
.quota .bar{height:4px;border-radius:2px;background:#dadce0;overflow:hidden;margin:6px 0 6px}
.quota .bar b{display:block;height:100%;background:var(--accent)}
.quota p{margin:0;font-size:13px;color:var(--text2);line-height:1.4}
.qbtn{margin:12px 0 0;border:1px solid #747775;background:none;border-radius:20px;padding:8px 22px;font-size:14px;font-weight:500;color:var(--accent-d);cursor:pointer}
.qbtn:hover{background:rgba(224,122,47,.06)}
.main{background:var(--white);border-radius:16px;margin:0 16px 16px 0;display:flex;flex-direction:column;min-width:0;min-height:0}
.mh{display:flex;align-items:center;gap:8px;padding:16px 24px 6px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:4px;font-size:22px;color:var(--text)}
.crumb button{border:0;background:none;font-size:22px;color:var(--text2);padding:2px 10px;border-radius:18px;cursor:pointer}
.crumb button:hover{background:rgba(60,64,67,.08)}
.crumb b{font-weight:400;padding:2px 10px}
.mh .vbadge{margin-left:auto}
.canvas{flex:1;min-width:0;min-height:0;overflow-y:auto;padding:22px 24px 60px}
.page{max-width:1120px}
.eyebrow{display:none}
.page>h1{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.6px}
.lead{font-size:15.5px;font-weight:300;color:var(--text2);line-height:1.7;margin:10px 0 26px;max-width:720px}
.page h2{font-size:18px;font-weight:600;margin:34px 0 14px;padding-bottom:10px;border-bottom:1.5px solid var(--border)}

/* proefomgeving */
.pg{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:24px;align-items:start}
.panel{background:var(--white);border:1px solid var(--border);border-radius:10px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.ph h3{font-size:13.5px;font-weight:600}
.ph .mth{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--green);border-radius:4px;padding:1px 7px}
.ph code{font-family:var(--mono);font-size:12.5px;color:var(--text2)}
.pb{padding:16px}
.seg{display:inline-flex;border-bottom:1.5px solid var(--border);gap:2px;margin-bottom:14px;width:100%}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px}
.seg button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.fl{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;position:relative}
.fl label{font-size:12px;font-weight:500;color:var(--text2)}
.fl input,.fl select{border:1px solid var(--border2);border-radius:6px;background:var(--white);padding:8px 10px;width:100%}
.fl input:focus,.fl select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.hint{font-size:11.5px;color:var(--text3)}
.sug{position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--white);border:1px solid var(--border);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.1);margin-top:4px;max-height:240px;overflow:auto}
.sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13px}
.sug button small{color:var(--text3);margin-left:6px;font-family:var(--mono);font-size:11px}
.sug button:hover{background:var(--cream)}
.tg{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--text2);margin:4px 0 10px}
.tg input{accent-color:var(--accent);margin:0}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--cream);margin-bottom:12px}
.kgrid .fl{margin:0}
.kgrid .fl label{font-size:11.5px;font-weight:400;color:var(--text3)}
.kgrid .fl select,.kgrid .fl input{padding:5px 7px;font-size:12.5px}
.kgrid .fl select.set,.kgrid .fl input.set{border-color:var(--text2)}
.kq{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text3);margin-bottom:12px}
.kq button{border:0;background:none;color:var(--text2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12px;padding:0}
.send{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border2);background:var(--white);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06);color:#fff}
.btn[disabled]{opacity:.6;cursor:wait}
.meta{font-size:12px;color:var(--text3);font-family:var(--mono)}

pre.code{margin:0;background:var(--code-bg);color:var(--code-text);font-family:var(--mono);font-size:12px;line-height:1.6;padding:14px 16px;border-radius:0 0 10px 10px;overflow:auto;max-height:620px;white-space:pre}
pre.code.sm{border-radius:8px;max-height:none}
.j-k{color:#f0b77a}.j-s{color:#a8d4a2}.j-n{color:#8fc1f0}.j-b{color:#e6a3c9}.j-c{color:#7d776d}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--green)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.rt{display:flex;flex-direction:column;gap:14px;padding:16px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.flag.ok{background:var(--green-s);color:var(--green)}
.flag.exp{background:var(--amber-s);color:var(--amber)}
.flag b{display:block;font-weight:600}
.flag svg{flex:none;margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--accent-s);color:var(--text2);font-weight:600;font-size:11px;letter-spacing:.2px;padding:8px 10px;text-align:left;border-bottom:1.5px solid var(--accent-b);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.t td small{display:block;font-size:11.5px;color:var(--text3)}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.tw{border:1px solid var(--border);border-radius:10px;overflow:auto;background:var(--white)}
.rc{display:inline;font-size:13px;white-space:nowrap}
.rc.kna{color:var(--text3)}
.ql{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;font-weight:700;font-size:12px;border:1.5px solid currentColor}
.qA{color:var(--green)}.qB{color:var(--amber)}.qC{color:#b91c1c}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:11.5px;border:1px solid var(--border);border-radius:20px;padding:1px 9px;color:var(--text2);background:var(--white)}
.chips.d span{border-style:dashed}
.chips.s span{background:var(--cream);color:var(--text3)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--text3)}
.kv dd{margin:0}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* flow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 0 6px;border:1px solid var(--border);border-radius:10px;background:var(--white);overflow:hidden}
.flow>div{padding:14px 18px;border-right:1px solid var(--border);position:relative}
.flow>div:last-child{border-right:0}
.flow b{display:block;font-size:13px;margin-bottom:2px}
.flow p{margin:0;font-size:12.5px;color:var(--text2);line-height:1.5}
.flow .st{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}

/* batch */
.bup{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border:1.5px dashed var(--border2);border-radius:10px;background:var(--white)}
.bup p{margin:0;font-size:13px;color:var(--text2);flex:1;min-width:240px}
.prog{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin:16px 0 6px}
.prog b{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.bsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--text3)}
.kpi .v{font-size:22px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:400;color:var(--text3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* gebruik */
.usebar{height:10px;border-radius:5px;background:var(--border);overflow:hidden;margin:8px 0 4px}
.usebar b{display:block;height:100%;background:var(--accent)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px 0;border-bottom:1px solid var(--border)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart i{display:block;width:100%;max-width:38px;border-radius:3px 3px 0 0;background:var(--accent)}
.chart i.t{background:var(--border2)}
.chart span{font-size:10.5px;color:var(--text3)}
.lbl{display:flex;justify-content:space-around;font-size:11px;color:var(--text3);padding-top:4px}
.key{font-family:var(--mono);font-size:12px;background:var(--cream);border:1px solid var(--border);border-radius:4px;padding:1px 7px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.note{font-size:12px;color:var(--text3);margin-top:12px}

.ep{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border)}
.ep .m{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;color:#fff;flex:none;min-width:44px;text-align:center}
.m.post{background:var(--green)}.m.get{background:#1d5fa8}
.ep code{font-family:var(--mono);font-size:13px;font-weight:600}
.ep p{margin:0;font-size:13px;color:var(--text2)}
.cl{border-left:2px solid var(--border);padding:0 0 18px 18px;position:relative}
.cl::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--white);border:2px solid var(--accent)}
.cl h3{font-size:14px;font-weight:600}
.cl h3 span{font-weight:400;color:var(--text3);font-size:12.5px;margin-left:8px}
.cl ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text2)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--text);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:all .2s;z-index:100;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* toegangsscherm */
#gate{position:fixed;inset:0;z-index:9999;overflow-y:auto;background:var(--cream);display:flex;flex-direction:column}
#gate::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(180,174,166,.75) 1px,transparent 1px);background-size:17px 17px;-webkit-mask-image:radial-gradient(ellipse 520px 380px at 50% 38vh,transparent 0,#000 100%);mask-image:radial-gradient(ellipse 520px 380px at 50% 38vh,transparent 0,#000 100%)}
.g-top{position:relative;z-index:1;margin:16px;height:80px;border-radius:18px;background:var(--white);box-shadow:0 4px 24px rgba(28,26,23,.08);display:flex;align-items:center;gap:12px;padding:0 24px}
.g-top .mk{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.g-top .mk i,.g-brand i{display:grid;place-items:center;font:700 12px var(--word);color:#fff;font-style:normal;width:22px;height:22px;border-radius:3px}
.g-top .wm{font-family:var(--word);font-size:13.6px;color:var(--text2);line-height:1.35}
.g-body{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;padding:14vh 24px 60px}
.g-brand{display:flex;gap:5px;margin-bottom:14px}
.g-brand i{width:40px;height:40px;border-radius:7px;font-size:17px}
.g-name{font-family:var(--word);font-size:20px;font-weight:500;margin-bottom:28px;color:var(--text)}
.g-card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:30px 30px 24px;max-width:400px;width:100%;box-shadow:0 16px 44px rgba(0,0,0,.08);text-align:center}
.g-card input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14.5px;text-align:center;letter-spacing:.5px;margin-bottom:12px;background:var(--white)}
.g-card input:focus{outline:none;border-color:var(--accent)}
.g-card button{width:100%;padding:12px 0;background:var(--accent);color:#fff;border:0;border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer}
.g-card button:hover{opacity:.9}
.g-err{color:#c0392b;font-size:12.5px;margin-top:10px;font-weight:500}
.g-legal{font-size:12.5px;color:var(--text2);font-weight:300;line-height:1.55;margin:18px 0 0}
.g-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text3);font-weight:300}
@media (max-width:1100px){.pg{grid-template-columns:1fr}.bsum{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  html,body{height:auto}
  .app{display:block;height:auto;padding:0 16px 16px}
  .top{flex-wrap:wrap;padding:10px 0}
  .logo{width:auto}
  .search{order:3;flex-basis:100%;max-width:none}
  .side{flex-direction:row;overflow-x:auto;gap:4px;padding:0 0 10px}
  .new{margin:0;height:40px;flex:none}
  .ni{width:auto;flex:none;white-space:nowrap}
  .ni .mt,.gap,.quota{display:none}
  .main{margin:0}
  .canvas{overflow:visible;padding:6px 14px 40px}
  .flow,.g2{grid-template-columns:1fr}
  .flow>div{border-right:0;border-bottom:1px solid var(--border)}
  .kgrid{grid-template-columns:1fr}
  .envsw{display:none}
  .crumb,.crumb button{font-size:16px}
  .mh .vbadge{display:none}
  .newm{top:46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9<>?%.,+-]/g,'');

function parseVal(k,v){
  if(['jaar','ingang','drempel'].includes(k)){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:Math.round(n);}
  if(k=='type'){const s=norm(v);return /util|kantoor|school|zorg|bedrijf|winkel/.test(s)?'util':'woning';}
  const o=OPTS[k];const s=norm(v);
  const bin=o&&typeof o[0][0]==='number';
  if(s===''){return bin?0:(o.some(x=>x[0]==='?')?'?':o[0][0]);}
  if(['onbekend','?','nb','n.b.','unknown'].includes(s))return bin?0:'?';
  if(bin){if(/^(ja|j|1|true|yes|aanwezig|x)$/.test(s))return 1;return 0;}
  for(const [c,l] of o){if(norm(c)===s||norm(l)===s)return c;}
  const num=parseFloat(s.replace('%','').replace(',','.'));
  if(!isNaN(num)){
    if(k=='glas'){const p=num<=1?num*100:num;return p<35?'<35':p<=50?'35-50':p<=75?'50-75':'>75';}
    if(k=='zta'){return num>=.75?'enkel':num>=.6?'dubbel':num>.4?'hr':'folie';}
    if(k=='iso'){return num<1.3?'r1':num<=2.5?'r2':num<=3.5?'r3':'r4';}
    if(k=='spui'){return num>=2?'2':num>=1?'1':'0';}
    if(k=='instroom'){return num<=15?'15':num<=50?'50':'nee';}
  }
  for(const [c,l] of o){const nl=norm(l);if(nl.startsWith(s)||s.startsWith(norm(c))&&norm(c).length>1)return c;}
  const syn={kelder:{souterrain:'vol',ja:'vol',volledig:'vol',gedeeltelijk:'deel',parkeergarage:'park',nee:'geen'},fund:{houtenpalen:'hout',hout:'hout',staal:'staal',ondiep:'staal',beton:'beton',betonpalen:'beton'},

    instroom:{nee:'nee',geen:'nee'},dak:{zonnepanelen:'pv',groen:'groen',wit:'groen'},riool:{gemengd:'gemengd',gescheiden:'gescheiden'}};
  const sy=syn[k];if(sy)for(const w in sy){if(s.includes(norm(w)))return sy[w];}
  WARN.push(`“${v}” bij ${XC.find(c=>c[0]==k)[1]} niet herkend`);
  return bin?0:'?';
}
function importRows(rows,fname){
  if(!rows.length){toast('Geen gebouwen gevonden in '+fname);return;}
  const hdr=Object.keys(rows[0]);const map={};
  hdr.forEach(h=>{const n=hnorm(h);const c=XC.find(c=>hnorm(c[1])===n||c[2].includes(n)||c[0].toLowerCase()===n);if(c&&!Object.values(map).includes(c[0]))map[h]=c[0];});
  WARN=[];COLS=Object.values(map);
  const out=[];rows.forEach((r,i)=>{const src={};let any=false;
    for(const h in map){const k=map[h];const v=r[h];if(v!==''&&v!=null)any=true;
      src[k]=['id','naam','adres','plaats'].includes(k)?String(v??'').trim():parseVal(k,v);}
    if(!any)return;
    if(!src.naam)src.naam=src.adres||src.id||('Gebouw '+(i+1));
    if(!src.id)src.id='G-'+String(i+1).padStart(3,'0');

}

const KLAB={glas:'Glasoppervlak',massa:'Thermische massa',zon:'Zonwering',zta:'Beglazing',dak:'Kleur dak',gevel:'Kleur gevel',overstek:'Overstek',koel:'Actieve koeling',iso:'Isolatie',spui:'Spuiventilatie',ingang:'Hoogte ingang (cm)',schotIn:'Schot ingang',kelder:'Ondergrondse ruimte',drempel:'Drempel kelder (cm)',rooster:'Waterrooster',schotK:'Schot kelder',instroom:'Overige instroompunten',instroomSchot:'Schot instroompunten',riool:'Rioolstelsel',klep:'Terugslagklep',inst:'Installaties',fund:'Fundering'};
const bagId=s=>{const h=hash(s);return '0'+String(344+(h%600)).padStart(3,'0')+'1000'+String(h).padStart(10,'0').slice(-8);};
const reqId=()=>'req_'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
const BAGJAAR=b=>b.jaar||1900+(hash(b.adres)%120);
function omgeving(b){const o=b.o,r=rng(hash(b.adres+'|'+b.plaats+'|x'));
  const wn={geen:0,laag:2,middel:3,hoog:4}[o.hitte];
  const nb=Math.floor(r()*3);const gw=wpick(r,[0,1,2,3,4],[3,4,3,2,1]);
  const wd=[0,6,12,17,25,38][+o.wo]+Math.round(r()*3);
  const ovk={zl:1,l:2,m:3,h:5}[o.ov];const md=ovk<=1?0:Math.round((ovk*35+r()*60));
  const pr={L:2,M:3,H:4}[o.paalB];
  return {
   hitte:{warme_nachten:{waarde:{geen:'0 nachten',laag:'< 2 weken',middel:'2 – 3 weken',hoog:'> 3 weken'}[o.hitte],klasse:KL[wn],score:wn}},
   droogte:{natuurbrand:{waarde:['laag','middel','hoog'][nb],klasse:KL[nb+1],score:nb+1},
     paalrot:{waarde:'buurtklasse '+{L:'laag',M:'middel',H:'hoog'}[o.paalB]+', bodem '+{C:'klei',P:'veen',S:'zand'}[o.paalS],klasse:KL[pr],score:pr},
     verschilzetting:{waarde:'buurtscore '+o.vz,klasse:KL[+o.vz],score:+o.vz}},
   wateroverlast:{waterdiepte_70mm_2u:{waarde:wd+' cm',klasse:KL[+o.wo],score:+o.wo},grondwateroverlast:{waarde:['geen toename','beperkte toename','toename','sterke toename','zeer sterke toename'][gw],klasse:KL[gw],score:gw}},
   overstroming:{max_waterdiepte:{waarde:md?(md/100).toFixed(1).replace('.',',')+' m':'0 m',klasse:KL[ovk<=1?0:Math.min(5,ovk)],score:ovk<=1?0:Math.min(5,ovk)},
     kans_20cm_2050:{waarde:{zl:'< 1/3000 per jaar',l:'1/300 – 1/3000',m:'1/30 – 1/300',h:'> 1/30 per jaar'}[o.ov],klasse:KL[ovk],score:ovk}}};}
function bereken(b,env){
  const prov=GEB_KEYS.filter(k=>b.prov&&b.prov.has(k));
  const S=Object.assign({},b);if(!S.jaar)S.jaar=BAGJAAR(b);
  const afgeleid=['bouwjaar (BAG)'];
  if(!prov.includes('iso')){S.iso='jaar';afgeleid.push('isolatie uit bouwjaar');}
  if(!prov.includes('riool')&&S.jaar>1980){afgeleid.push('ontlastput (bouwjaar na 1980)');}
  const std=GEB_KEYS.filter(k=>!prov.includes(k)&&!(k=='iso')&&!['schotIn','schotK','rooster','instroomSchot','klep','drempel'].includes(k)).map(k=>KLAB[k]);
  const heeftGebouw=prov.length>0;
  const res={request_id:reqId(),api_versie:'v1',omgeving:env,status:'ok',
    pand:{bag_pand_id:b.bag||bagId(b.adres+b.plaats),adres:[b.adres,b.plaats].filter(Boolean).join(', '),bouwjaar:S.jaar,bron_bouwjaar:b.jaar&&b.prov&&b.prov.has('jaar')?'aangeleverd':'BAG',gebruiksdoel:b.type=='util'?'kantoorfunctie':'woonfunctie'},
    resultaattype:heeftGebouw?'klimaatrisicoscore':'blootstelling',
    interpretatie:heeftGebouw?'Gebouwscore en klimaatrisicoscore berekend. Niet aangeleverde kenmerken zijn met standaardwaarden (zeer kwetsbaar) ingevuld; zie kwaliteit.':'Alleen blootstelling (FCAB-1). Lever gebouwkenmerken aan om een gebouwscore en klimaatrisicoscore te ontvangen.',
    omgevingsscore:omgeving(b),gebouwscore:null,klimaatrisicoscore:null,kwaliteit:null,
    metadata:{fcab_versie:FCAB_V,rekenkern_versie:KERN_V,berekend_op:new Date().toISOString().replace(/\.\d+Z$/,'Z'),databronnen:BRONNEN.map(x=>({indicator:x[0],naam:x[1],bron:x[2],versie:x[3],resolutie:x[4]}))}};
  if(heeftGebouw){
    S.ingang=prov.includes('ingang')?S.ingang:null;S.drempel=prov.includes('drempel')?S.drempel:null;
    const R=calc(S);
    res.gebouwscore={hitte:{oververhitting:R.hitte.score},droogte:{paalrot:R.dr.paal?{bouwjaarklasse:PAALY[R.dr.pi]}:null,verschilzetting:R.dr.vz?R.dr.vzScore:null},
      wateroverlast:{bui_70mm_2u:R.wo.score},overstroming:{kans_20cm:R.ov.score,kans_50cm:R.ov.score}};
    const c=v=>v==null?{klasse:'Niet van toepassing',score:null}:{klasse:CLS[v],score:v};
    res.klimaatrisicoscore={hitte:c(R.hitte.risk),droogte:c(R.dr.risk),wateroverlast:c(R.wo.risk),overstroming:c(R.ov.risk)};
    const vol=prov.length/16;const label=vol>=.75?'A':vol>=.4?'B':'C';
    res.kwaliteit={label,toelichting:{A:'Merendeel kenmerken aangeleverd',B:'Deels aangeleverd, deels standaardwaarden',C:'Vooral standaardwaarden: indicatief'}[label],
      aangeleverd:prov.map(k=>KLAB[k]),afgeleid:afgeleid,standaardwaarde:std};
  }
  return res;}

    rs.map(r=>{const k=r.klimaatrisicoscore,om=r.omgevingsscore;const cell=(kk,omv)=>k?chip(k[kk].score):`<span title="Blootstelling">${chip(omv.score,omv.klasse)}</span>`;

  if(done==n)h+=`<div class="send" style="margin-top:14px"><button class="btn" type="button" id="bb-xlsx">Download resultaten (.xlsx)</button><button class="btn" type="button" id="bb-json">Download JSON</button><span class="meta">${n} pandberekeningen afgeschreven van ${V.env=='productie'?'het abonnement':'de testomgeving'}</span></div>`;
  h+=`<p class="note">Bij alleen blootstelling toont de tabel de omgevingsklasse; zodra gebouwkenmerken zijn aangeleverd het klimaatrisico.</p>`;
  return h+`</div>`;}
function runBatch(list,fname){V.batchFile=fname;V.batch={id:'batch_'+Math.random().toString(36).slice(2,10),items:list,res:[]};nav('batch');
  let i=0;const step=()=>{if(V.view!='batch'){}if(i>=list.length){render();toast(list.length+' panden berekend');return;}
    const b=list[i++];b.prov=new Set(GEB_KEYS.filter(k=>b[k]!=null&&b[k]!=='?'&&!(DEF[k]===b[k]&&['schotIn','schotK','rooster','instroomSchot','klep'].includes(k))));
    const r=bereken(b,V.env);V.batch.res.push(r);if(V.env=='productie')V.usage.prod++;else V.usage.test++;
    if(V.view=='batch')render();setTimeout(step,140);};
  V.usage.calls++;setTimeout(step,300);}

function exportBatch(kind){const rs=V.batch.res;
  if(kind=='json'){const blob=JSON.stringify({batch_id:V.batch.id,aantal:rs.length,resultaten:rs.map(r=>{const o=Object.assign({},r);return o;})},null,2);saveText('fcab-batch-resultaten.json',blob);return;}
  const wb=XLSX.utils.book_new();
  const rows=rs.map(r=>{const o={'BAG pand-ID':r.pand.bag_pand_id,Adres:r.pand.adres,Bouwjaar:r.pand.bouwjaar,Resultaattype:r.resultaattype,Kwaliteit:r.kwaliteit?r.kwaliteit.label:''};
    const om=r.omgevingsscore;o['Omg. hitte']=om.hitte.warme_nachten.klasse;o['Omg. paalrot']=om.droogte.paalrot.klasse;o['Omg. verschilzetting']=om.droogte.verschilzetting.klasse;o['Omg. natuurbrand']=om.droogte.natuurbrand.klasse;o['Omg. waterdiepte']=om.wateroverlast.waterdiepte_70mm_2u.klasse;o['Omg. grondwater']=om.wateroverlast.grondwateroverlast.klasse;o['Omg. overstroming kans']=om.overstroming.kans_20cm_2050.klasse;o['Omg. max. waterdiepte']=om.overstroming.max_waterdiepte.klasse;
    if(r.klimaatrisicoscore)['hitte','droogte','wateroverlast','overstroming'].forEach(t=>o['Risico '+t]=r.klimaatrisicoscore[t].klasse);
    o['FCAB-versie']=r.metadata.fcab_versie;o['Request-ID']=r.request_id;return o;});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Resultaten');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(BRONNEN.map(x=>({Indicator:x[0],Databron:x[1],Leverancier:x[2],Versie:x[3],Resolutie:x[4]}))),'Databronnen');
  saveFile('fcab-batch-resultaten.xlsx',wb);}
async function saveText(name,text){let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(dl){try{await dl.save({filename:name,data:text});toast(name+' opgeslagen');}catch(e){if(e&&e.code!=='declined')toast('Opslaan lukte niet in deze weergave');}return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){}}

const GH='73e2822498c988475f994d5cbc7348677198694cb01830ef3182527acd0f6d0e';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function unlock(){$('gate').hidden=true;$('app').hidden=false;try{sessionStorage.setItem('rk-ok','1');}catch(e){}}
try{if(sessionStorage.getItem('rk-ok')==='1')unlock();}catch(e){}
$('g-form').addEventListener('submit',async e=>{e.preventDefault();const v=$('g-in').value;let ok=false;
  try{ok=(await sha(v))===GH;}catch(err){ok=false;}
  if(ok)unlock();else{$('g-err').hidden=false;$('g-in').select();}});
